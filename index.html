<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animus Tavern Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Add YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            /* Prevent body scrolling while dragging */
            overflow: hidden;
            background-color: #030014;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4) 0%, transparent 50%), /* Deep Purple */
                radial-gradient(circle at 85% 30%, rgba(14, 116, 144, 0.4) 0%, transparent 50%), /* Cyan */
                radial-gradient(circle at 50% 80%, rgba(134, 25, 143, 0.3) 0%, transparent 50%); /* Magenta */
        }
        
        .stars {
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* Custom scrollbar for the tracklist */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d946ef; /* fuchsia-500 */ }
        
        .glass-modal {
            background: rgba(15, 10, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.15); /* subtle purple border */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 20px rgba(168, 85, 247, 0.1); /* outer glow */
            position: absolute; /* Crucial for dragging */
        }

        .drag-handle {
            touch-action: none; /* Prevent browser handling of touch gestures on handle */
        }

        input[type="range"] {
            accent-color: #d946ef; /* Fuchsia */
        }
    </style>
</head>
<body class="text-white min-h-screen font-sans selection:bg-fuchsia-500 selection:text-white relative w-full h-full">

    <!-- Starry background layer -->
    <div class="stars pointer-events-none absolute inset-0 z-0 opacity-50"></div>

    <!-- Hidden Audio Elements -->
    <audio id="audio-player"></audio>
    <div id="yt-player" class="hidden absolute pointer-events-none opacity-0"></div>

    <!-- Top Status Bar -->
    <div class="fixed top-0 left-0 w-full bg-[#030014]/80 backdrop-blur-md border-b border-purple-900/50 p-2 flex justify-between items-center z-0 px-4 text-sm text-gray-400">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-discord-logo text-purple-400 text-lg"></i>
            <span class="font-semibold text-gray-200">Animus Tavern Music Player</span>
            <span class="opacity-50 hidden sm:inline">|</span>
            <span id="discord-status" class="text-yellow-400 text-xs animate-pulse">Connecting to Discord SDK...</span>
        </div>
        <div id="clock" class="font-mono">00:00</div>
    </div>

    <!-- MODAL 1: THE PLAYER -->
    <div id="modal-player" class="glass-modal rounded-2xl w-[340px] md:w-[400px] flex flex-col z-10" style="top: 80px; left: 40px;">
        <!-- Drag Handle -->
        <div class="drag-handle bg-purple-900/30 p-3 rounded-t-2xl border-b border-purple-700/50 flex justify-between items-center cursor-grab hover:bg-purple-800/40 transition-colors">
            <div class="flex items-center gap-2 text-gray-300">
                <i class="ph ph-dots-six-vertical text-lg opacity-50"></i>
                <span class="font-semibold text-sm tracking-wide">PLAYER</span>
            </div>
            <div class="flex gap-1.5">
                <div class="w-3 h-3 rounded-full bg-gray-600"></div>
                <div class="w-3 h-3 rounded-full bg-gray-600"></div>
                <div class="w-3 h-3 rounded-full bg-fuchsia-500 animate-pulse"></div>
            </div>
        </div>

        <!-- Player Content -->
        <div class="p-6 flex flex-col items-center relative overflow-hidden">
            <!-- decorative background glow -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-fuchsia-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div id="album-art" class="w-48 h-48 bg-[#0a0514]/80 rounded-2xl shadow-2xl flex items-center justify-center mb-6 border border-purple-900/50 transition-transform duration-300 relative z-10">
                <i class="ph ph-vinyl-record text-7xl text-gray-600"></i>
            </div>

            <div class="text-center w-full relative z-10">
                <h2 id="track-title" class="text-2xl font-bold truncate mb-1">No Track Loaded</h2>
                <p id="track-artist" class="text-fuchsia-400 text-sm mb-6 truncate font-medium">Awaiting Input...</p>

                <!-- Progress Bar -->
                <div class="flex items-center gap-3 mb-6 text-xs text-gray-400 font-mono">
                    <span id="time-current">0:00</span>
                    <div class="flex-grow h-1.5 bg-gray-700/50 rounded-full cursor-pointer relative" id="progress-container">
                        <div id="progress-bar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-purple-600 via-fuchsia-500 to-cyan-400 rounded-full w-0 transition-all duration-75"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>

                <!-- Controls -->
                <div class="flex items-center justify-center gap-4 md:gap-6">
                    <button id="btn-shuffle" class="text-gray-500 hover:text-white transition-colors p-2" title="Shuffle">
                        <i class="ph-bold ph-shuffle text-xl"></i>
                    </button>
                    <button id="btn-prev" class="text-gray-400 hover:text-white transition-transform hover:scale-110 p-2">
                        <i class="ph-fill ph-skip-back text-2xl"></i>
                    </button>
                    <button id="btn-play" class="bg-gradient-to-br from-purple-600 to-fuchsia-500 hover:from-purple-500 hover:to-fuchsia-400 text-white w-14 h-14 rounded-full flex items-center justify-center transition-transform hover:scale-105 shadow-lg shadow-fuchsia-500/30">
                        <i class="ph-fill ph-play text-2xl ml-1" id="play-icon"></i>
                    </button>
                    <button id="btn-next" class="text-gray-400 hover:text-white transition-transform hover:scale-110 p-2">
                        <i class="ph-fill ph-skip-forward text-2xl"></i>
                    </button>
                    <button id="btn-repeat" class="text-gray-500 hover:text-white transition-colors p-2" title="Repeat One">
                        <i class="ph-bold ph-repeat text-xl"></i>
                    </button>
                </div>
                
                <!-- Volume -->
                <div class="flex items-center justify-center gap-3 mt-6">
                    <i class="ph ph-speaker-low text-gray-500"></i>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" class="w-24 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    <i class="ph ph-speaker-high text-gray-500"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: QUEUE & UPLOAD -->
    <div id="modal-queue" class="glass-modal rounded-2xl w-[340px] md:w-[380px] h-[420px] flex flex-col z-10" style="top: 80px; right: 40px;">
        <!-- Drag Handle -->
        <div class="drag-handle bg-purple-900/30 p-3 rounded-t-2xl border-b border-purple-700/50 flex justify-between items-center cursor-grab hover:bg-purple-800/40 transition-colors">
            <div class="flex items-center gap-2 text-gray-300">
                <i class="ph ph-dots-six-vertical text-lg opacity-50"></i>
                <span class="font-semibold text-sm tracking-wide">QUEUE & UPLOAD</span>
            </div>
            <span id="track-count" class="text-xs font-mono bg-gray-700 px-2 py-0.5 rounded text-gray-300">0 TRKS</span>
        </div>

        <div class="flex flex-col flex-grow overflow-hidden p-4 gap-4">
            
            <!-- Upload Zone -->
            <div id="upload-zone" class="border border-dashed border-gray-600 hover:border-fuchsia-500 bg-gray-800/30 rounded-xl p-4 text-center cursor-pointer transition-colors relative group shrink-0">
                <input type="file" id="file-input" accept="audio/mpeg, audio/mp3" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <i class="ph ph-upload-simple text-2xl text-gray-500 group-hover:text-fuchsia-400 mb-1 transition-colors"></i>
                <p class="text-sm text-gray-300 font-medium">Drop MP3s or Folders here</p>
                <p class="text-xs text-gray-500">Supports multiple files & folders</p>
            </div>

            <!-- YouTube Link Add -->
            <div class="flex gap-2 shrink-0">
                <input type="text" id="yt-link-input" placeholder="Paste YouTube link here..." class="flex-grow bg-gray-900/80 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-fuchsia-500 transition-colors">
                <button id="btn-add-yt" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg text-sm font-semibold transition-colors">
                    Add
                </button>
            </div>

            <!-- Playlist -->
            <div class="bg-gray-800/20 rounded-xl flex-grow overflow-hidden flex flex-col border border-gray-700/30">
                <div id="playlist" class="overflow-y-auto p-2 flex flex-col gap-1 h-full min-h-[140px]">
                    <!-- Empty State -->
                    <div class="h-full flex flex-col items-center justify-center text-gray-500 p-4 text-center">
                        <i class="ph ph-music-notes-simple text-4xl mb-2 opacity-50"></i>
                        <p class="text-sm">Queue is empty</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Type module allows us to use modern imports like the Discord SDK -->
    <script type="module">
        // --- 1. Discord Embedded App SDK Integration ---
        import { DiscordSDK } from 'https://esm.sh/@discord/embedded-app-sdk';

        // NOTE: Before deploying, replace this with your actual Discord Application Client ID!
        const DISCORD_CLIENT_ID = 'YOUR_DISCORD_CLIENT_ID';
        
        let discordSdk;

        async function initDiscord() {
            try {
                // The SDK throws an error if it's not opened inside a Discord iframe (missing frame_id)
                // This check prevents it from crashing when you test it locally in your standard browser.
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.get('frame_id')) {
                    throw new Error("Missing frame_id. Running in browser instead of Discord.");
                }

                // Initialize the SDK
                discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
                
                // This command tells the Discord client your activity has loaded and is ready to be shown
                await discordSdk.ready();
                
                console.log("Discord SDK Handshake Complete!");
                
                // Update top bar UI
                const statusSpan = document.getElementById('discord-status');
                statusSpan.textContent = "Activity Ready";
                statusSpan.classList.replace('text-yellow-400', 'text-green-400');
                statusSpan.classList.remove('animate-pulse');

                // TODO: Here is where you would handle authentication if you need to know exactly 
                // who the user is, or fetch the channel ID for a multiplayer backend server.

            } catch (error) {
                console.warn("Discord SDK Initialization Skipped:", error.message);
                const statusSpan = document.getElementById('discord-status');
                statusSpan.textContent = "Running Outside Discord";
                statusSpan.classList.replace('text-yellow-400', 'text-gray-500');
                statusSpan.classList.remove('animate-pulse');
            }
        }

        // Start the handshake immediately
        initDiscord();


        // --- State ---
        let tracks = [];
        let currentTrackIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeatOne = false;
        let shuffleHistory = [];
        let zIndexCounter = 10;
        
        // --- Player Engines ---
        let activeEngine = 'html5'; // 'html5' or 'youtube'
        let ytPlayer = null;
        let isYtReady = false;

        // Initialize YouTube Player globally since the API calls it on the window object
        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '10',
                width: '10',
                playerVars: { 'controls': 0, 'disablekb': 1, 'playsinline': 1 },
                events: {
                    'onReady': () => { isYtReady = true; },
                    'onStateChange': onYtStateChange
                }
            });
        };

        function onYtStateChange(event) {
            if (activeEngine !== 'youtube') return;
            
            if (event.data === YT.PlayerState.ENDED) {
                playNext(true);
            } else if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayIcon();
                timeTotal.textContent = formatTime(ytPlayer.getDuration());
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updatePlayIcon();
            }
        }

        // --- DOM Elements ---
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('btn-play');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const volumeSlider = document.getElementById('volume-slider');
        
        const shuffleBtn = document.getElementById('btn-shuffle');
        const repeatBtn = document.getElementById('btn-repeat');
        
        const trackTitleUI = document.getElementById('track-title');
        const trackArtistUI = document.getElementById('track-artist');
        const albumArt = document.getElementById('album-art');
        
        const fileInput = document.getElementById('file-input');
        const playlistUI = document.getElementById('playlist');
        const trackCountUI = document.getElementById('track-count');
        const ytLinkInput = document.getElementById('yt-link-input');
        const btnAddYt = document.getElementById('btn-add-yt');

        // --- Clock Update ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // --- Initialization ---
        audio.volume = volumeSlider.value;

        // --- Dragging Logic ---
        function makeDraggable(modalId) {
            const modal = document.getElementById(modalId);
            const handle = modal.querySelector('.drag-handle');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            modal.addEventListener('mousedown', () => bringToFront(modal));
            modal.addEventListener('touchstart', () => bringToFront(modal), {passive: true});

            handle.addEventListener('mousedown', (e) => {
                if (e.target.closest('.no-drag')) return;
                dragStart(e);
            });
            handle.addEventListener('touchstart', (e) => {
                if (e.target.closest('.no-drag')) return;
                dragStart(e);
            }, {passive: false});

            function bringToFront(element) {
                zIndexCounter++;
                element.style.zIndex = zIndexCounter;
            }

            function dragStart(e) {
                bringToFront(modal);
                
                if (e.type === 'touchstart') {
                    pos3 = e.touches[0].clientX;
                    pos4 = e.touches[0].clientY;
                    document.addEventListener('touchmove', dragAction, {passive: false});
                    document.addEventListener('touchend', dragEnd);
                } else {
                    e.preventDefault();
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    document.onmouseup = dragEnd;
                    document.onmousemove = dragAction;
                }
                handle.style.cursor = 'grabbing';
            }

            function dragAction(e) {
                if (e.type === 'touchmove') e.preventDefault();

                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                
                let newTop = modal.offsetTop - pos2;
                let newLeft = modal.offsetLeft - pos1;

                const headerHeight = 40; 
                if(newTop < headerHeight) newTop = headerHeight;
                if(newTop > window.innerHeight - 50) newTop = window.innerHeight - 50;
                
                modal.style.top = newTop + "px";
                modal.style.left = newLeft + "px";
            }

            function dragEnd() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.removeEventListener('touchmove', dragAction);
                document.removeEventListener('touchend', dragEnd);
                handle.style.cursor = 'grab';
            }
        }

        makeDraggable('modal-player');
        makeDraggable('modal-queue');

        // Responsive initial positioning
        window.addEventListener('load', () => {
            const player = document.getElementById('modal-player');
            const queue = document.getElementById('modal-queue');

            if (window.innerWidth < 800) {
                player.style.left = '50%';
                player.style.transform = 'translateX(-50%)';
                player.style.top = '60px';
                
                queue.style.left = '50%';
                queue.style.transform = 'translateX(-50%)';
                queue.style.top = '120px';
            } else {
                // Center them together side by side
                const totalWidth = player.offsetWidth + 20 + queue.offsetWidth;
                const startLeft = (window.innerWidth - totalWidth) / 2;
                const topPos = (window.innerHeight - queue.offsetHeight) / 2;
                
                player.style.left = startLeft + 'px';
                player.style.top = Math.max(60, topPos) + 'px';
                
                queue.style.left = (startLeft + player.offsetWidth + 20) + 'px';
                queue.style.top = Math.max(60, topPos) + 'px';
            }
        });

        // --- Audio & File Logic ---
        const uploadZone = document.getElementById('upload-zone');

        function processFile(file) {
            if (file.type === "audio/mpeg" || file.name.toLowerCase().endsWith(".mp3")) {
                const objectUrl = URL.createObjectURL(file);
                
                let title = file.name.replace('.mp3', '');
                let artist = "Local File";
                if (title.includes('-')) {
                    const parts = title.split('-');
                    artist = parts[0].trim();
                    title = parts.slice(1).join('-').trim();
                }

                tracks.push({
                    title: title,
                    artist: artist,
                    url: objectUrl,
                    filename: file.name,
                    type: "html5"
                });

                renderPlaylist();
                if (currentTrackIndex === -1 && tracks.length === 1) {
                    loadTrack(0);
                }
            }
        }

        // Add YouTube via UI input
        btnAddYt.addEventListener('click', () => {
            const url = ytLinkInput.value.trim();
            if (!url) return;

            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
            
            if (ytMatch) {
                tracks.push({
                    title: "YouTube Audio",
                    artist: "Added via URL",
                    url: url,
                    filename: "youtube_link",
                    type: "youtube",
                    ytId: ytMatch[1]
                });
                
                ytLinkInput.value = '';
                renderPlaylist();
                if (currentTrackIndex === -1 && tracks.length === 1) loadTrack(0);
            } else {
                alert("Please enter a valid YouTube link.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            Array.from(files).forEach(processFile);
            fileInput.value = ''; 
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => {
                uploadZone.classList.add('border-fuchsia-500', 'bg-purple-900/30');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => {
                uploadZone.classList.remove('border-fuchsia-500', 'bg-purple-900/30');
            }, false);
        });

        uploadZone.addEventListener('drop', (e) => {
            const items = e.dataTransfer.items;
            if (items) {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.kind === 'file') {
                        const entry = item.webkitGetAsEntry();
                        if (entry) traverseFileTree(entry);
                    }
                }
            } else {
                const files = e.dataTransfer.files;
                Array.from(files).forEach(processFile);
            }
        });

        function traverseFileTree(item, path) {
            path = path || "";
            if (item.isFile) {
                item.file(function(file) { processFile(file); });
            } else if (item.isDirectory) {
                let dirReader = item.createReader();
                dirReader.readEntries(function(entries) {
                    for (let i = 0; i < entries.length; i++) {
                        traverseFileTree(entries[i], path + item.name + "/");
                    }
                });
            }
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', () => playPrev());
        nextBtn.addEventListener('click', () => playNext(false));
        shuffleBtn.addEventListener('click', toggleShuffle);
        repeatBtn.addEventListener('click', toggleRepeat);
        
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            if (activeEngine === 'html5') timeTotal.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('ended', () => playNext(true));

        setInterval(() => {
            if (activeEngine === 'youtube' && isPlaying && isYtReady && ytPlayer.getCurrentTime) {
                const current = ytPlayer.getCurrentTime();
                const duration = ytPlayer.getDuration();
                if (duration > 0) {
                    const percent = (current / duration) * 100;
                    progressBar.style.width = `${percent}%`;
                    timeCurrent.textContent = formatTime(current);
                }
            }
        }, 500);

        progressContainer.addEventListener('click', (e) => {
            if (tracks.length === 0) return;
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            
            if (activeEngine === 'html5') {
                audio.currentTime = (clickX / width) * audio.duration;
            } else if (activeEngine === 'youtube' && isYtReady) {
                const duration = ytPlayer.getDuration();
                ytPlayer.seekTo((clickX / width) * duration, true);
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            if (isYtReady) ytPlayer.setVolume(e.target.value * 100);
        });

        function renderPlaylist() {
            trackCountUI.textContent = `${tracks.length} TRKS`;
            
            if (tracks.length === 0) {
                playlistUI.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-500 p-4 text-center">
                        <i class="ph ph-music-notes-simple text-4xl mb-2 opacity-50"></i>
                        <p class="text-sm">Queue is empty</p>
                    </div>`;
                return;
            }

            playlistUI.innerHTML = '';
            tracks.forEach((track, index) => {
                const isActive = index === currentTrackIndex;
                const trackEl = document.createElement('div');
                trackEl.className = `p-2 rounded-lg flex items-center gap-3 cursor-pointer transition-colors group ${isActive ? 'bg-fuchsia-500/20 border border-fuchsia-500/30' : 'hover:bg-purple-900/40 border border-transparent'}`;
                trackEl.onclick = () => loadTrack(index, true);

                trackEl.innerHTML = `
                    <div class="w-8 h-8 rounded bg-gray-800 flex items-center justify-center flex-shrink-0 relative overflow-hidden border border-gray-700">
                        ${isActive && isPlaying ? 
                            `<div class="flex gap-0.5 items-end h-3 w-3">
                                <div class="w-1 bg-fuchsia-400 rounded-t animate-[bounce_1s_infinite] h-full"></div>
                                <div class="w-1 bg-fuchsia-400 rounded-t animate-[bounce_0.8s_infinite] h-2/3"></div>
                                <div class="w-1 bg-fuchsia-400 rounded-t animate-[bounce_1.2s_infinite] h-1/2"></div>
                            </div>` 
                            : `<i class="ph ph-music-notes text-gray-500 group-hover:text-fuchsia-400 text-xs transition-colors"></i>`
                        }
                    </div>
                    <div class="flex-grow min-w-0">
                        <h4 class="font-semibold text-xs truncate ${isActive ? 'text-fuchsia-400' : 'text-gray-200'}">${track.title}</h4>
                        <p class="text-[10px] text-gray-400 truncate mt-0.5">${track.artist}</p>
                    </div>
                `;
                playlistUI.appendChild(trackEl);
            });
        }

        function loadTrack(index, autoPlay = false) {
            if (index < 0 || index >= tracks.length) return;
            
            currentTrackIndex = index;
            const track = tracks[index];
            
            trackTitleUI.textContent = track.title;
            trackArtistUI.textContent = track.artist;
            
            if (track.type === 'youtube') {
                activeEngine = 'youtube';
                audio.pause(); 
                if (isYtReady) {
                    ytPlayer.loadVideoById(track.ytId);
                    ytPlayer.setVolume(volumeSlider.value * 100);
                    if (!autoPlay && !isPlaying) ytPlayer.pauseVideo();
                }
            } else {
                activeEngine = 'html5';
                if (isYtReady) ytPlayer.stopVideo(); 
                audio.src = track.url;
                if (autoPlay || isPlaying) audio.play();
            }
            
            albumArt.classList.add('scale-105', 'border-fuchsia-500');
            setTimeout(() => albumArt.classList.remove('scale-105', 'border-fuchsia-500'), 200);

            renderPlaylist();
            
            if (autoPlay || isPlaying) {
                audio.play();
                isPlaying = true;
                updatePlayIcon();
            }
        }

        function togglePlay() {
            if (tracks.length === 0) return;
            
            if (activeEngine === 'html5') {
                if (audio.paused) {
                    audio.play();
                    isPlaying = true;
                } else {
                    audio.pause();
                    isPlaying = false;
                }
            } else if (activeEngine === 'youtube' && isYtReady) {
                const state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    ytPlayer.pauseVideo();
                    isPlaying = false;
                } else {
                    ytPlayer.playVideo();
                    isPlaying = true;
                }
            }
            
            updatePlayIcon();
            renderPlaylist(); 
        }

        function updatePlayIcon() {
            if (isPlaying) {
                playIcon.classList.replace('ph-play', 'ph-pause');
                playIcon.classList.remove('ml-1');
            } else {
                playIcon.classList.replace('ph-pause', 'ph-play');
                playIcon.classList.add('ml-1');
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-fuchsia-400', isShuffle);
            shuffleBtn.classList.toggle('text-gray-500', !isShuffle);
            if (isShuffle && currentTrackIndex !== -1) {
                shuffleHistory = [currentTrackIndex]; 
            }
        }

        function toggleRepeat() {
            isRepeatOne = !isRepeatOne;
            repeatBtn.classList.toggle('text-fuchsia-400', isRepeatOne);
            repeatBtn.classList.toggle('text-gray-500', !isRepeatOne);
            
            if (isRepeatOne) {
                repeatBtn.innerHTML = '<i class="ph-bold ph-repeat-once text-xl"></i>';
            } else {
                repeatBtn.innerHTML = '<i class="ph-bold ph-repeat text-xl"></i>';
            }
        }

        function playNext(autoEnded = false) {
            if (tracks.length === 0) return;
            
            if (autoEnded && isRepeatOne) {
                loadTrack(currentTrackIndex, true);
                return;
            }

            let nextIndex;
            
            if (isShuffle && tracks.length > 1) {
                let available = tracks.map((_, i) => i).filter(i => !shuffleHistory.includes(i));
                
                if (available.length === 0) {
                    shuffleHistory = [currentTrackIndex];
                    available = tracks.map((_, i) => i).filter(i => i !== currentTrackIndex);
                }
                
                nextIndex = available[Math.floor(Math.random() * available.length)];
                shuffleHistory.push(nextIndex);
            } else {
                nextIndex = currentTrackIndex + 1;
                if (nextIndex >= tracks.length) nextIndex = 0; 
            }
            
            loadTrack(nextIndex, true);
        }

        function playPrev() {
            if (tracks.length === 0) return;
            
            let currentSecs = activeEngine === 'html5' ? audio.currentTime : (isYtReady ? ytPlayer.getCurrentTime() : 0);
            if (currentSecs > 3) {
                if (activeEngine === 'html5') audio.currentTime = 0;
                else if (isYtReady) ytPlayer.seekTo(0, true);
                return;
            }
            
            let prevIndex;
            if (isShuffle && shuffleHistory.length > 1) {
                shuffleHistory.pop(); 
                prevIndex = shuffleHistory[shuffleHistory.length - 1]; 
            } else {
                prevIndex = currentTrackIndex - 1;
                if (prevIndex < 0) prevIndex = tracks.length - 1;
            }
            
            loadTrack(prevIndex, true);
        }

        function updateProgress() {
            if (activeEngine !== 'html5') return; 
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeCurrent.textContent = formatTime(audio.currentTime);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animus Tavern Music Player</title>
    <style>
        /* --- Zero-Dependency Pure CSS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #030014;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none; /* Prevent text selection while dragging */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(14, 116, 144, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(134, 25, 143, 0.3) 0%, transparent 50%);
        }

        /* Starry Background */
        .stars {
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            position: absolute; inset: 0; z-index: 0; opacity: 0.5; pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d946ef; }

        /* Utility Classes */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .gap-6 { gap: 24px; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        
        .text-xs { font-size: 12px; }
        .text-sm { font-size: 14px; }
        .text-2xl { font-size: 24px; font-weight: bold; }
        .font-mono { font-family: monospace; }
        .font-semibold { font-weight: 600; }
        
        .text-gray { color: #9ca3af; }
        .text-fuchsia { color: #d946ef; }
        .text-purple { color: #a855f7; }
        .text-white { color: #ffffff; }

        /* Top Bar */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(3, 0, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(88, 28, 135, 0.5);
            padding: 8px 16px;
            z-index: 100;
        }

        /* Glass Windows */
        .glass-modal {
            background: rgba(15, 10, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 20px rgba(168, 85, 247, 0.1);
            position: absolute;
            display: flex; flex-direction: column;
            width: 380px;
        }

        .drag-handle {
            background: rgba(88, 28, 135, 0.3);
            padding: 12px 16px;
            border-radius: 16px 16px 0 0;
            border-bottom: 1px solid rgba(126, 34, 206, 0.5);
            cursor: grab;
        }
        .drag-handle:active { cursor: grabbing; }

        .window-dot { width: 12px; height: 12px; border-radius: 50%; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Player UI */
        .player-content { padding: 24px; position: relative; }
        .glow-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 192px; height: 192px; background: rgba(217, 70, 239, 0.2);
            border-radius: 50%; filter: blur(40px); pointer-events: none;
        }

        .album-art {
            width: 192px; height: 192px;
            background: rgba(10, 5, 20, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(88, 28, 135, 0.5);
            margin: 0 auto 24px auto;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, border-color 0.2s;
            position: relative; z-index: 10;
        }
        .album-art.pop { transform: scale(1.05); border-color: #d946ef; }

        /* Progress Bar */
        .progress-container { flex-grow: 1; height: 6px; background: rgba(55, 65, 81, 0.5); border-radius: 4px; cursor: pointer; position: relative; }
        .progress-bar { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; background: linear-gradient(to right, #9333ea, #d946ef, #22d3ee); width: 0%; transition: width 0.1s linear; }

        /* Buttons */
        button { background: none; border: none; color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; outline: none; }
        .icon-btn:hover { color: #ffffff; transform: scale(1.1); }
        .icon-btn.active { color: #d946ef; }
        
        .btn-play {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #9333ea, #d946ef);
            color: white; box-shadow: 0 10px 15px -3px rgba(217, 70, 239, 0.3);
        }
        .btn-play:hover { transform: scale(1.05); }

        /* Volume Slider */
        input[type="range"] { -webkit-appearance: none; width: 96px; height: 4px; background: #374151; border-radius: 2px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #d946ef; cursor: pointer; }

        /* Queue UI */
        .queue-content { padding: 16px; display: flex; flex-direction: column; gap: 16px; height: calc(100% - 45px); }
        
        .upload-zone {
            border: 1px dashed rgba(156, 163, 175, 0.5);
            border-radius: 12px; padding: 16px; text-align: center;
            background: rgba(31, 41, 55, 0.3);
            transition: all 0.2s; position: relative; flex-shrink: 0;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: #d946ef; background: rgba(88, 28, 135, 0.3); color: white;}
        .file-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

        .playlist-container {
            background: rgba(31, 41, 55, 0.2); border-radius: 12px;
            border: 1px solid rgba(55, 65, 81, 0.3);
            flex-grow: 1; overflow-y: auto; padding: 8px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .track-item {
            padding: 8px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent;
        }
        .track-item:hover { background: rgba(55, 65, 81, 0.5); }
        .track-item.active { background: rgba(217, 70, 239, 0.1); border-color: rgba(217, 70, 239, 0.3); }
        
        .track-icon { width: 32px; height: 32px; background: #1f2937; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 1px solid #374151; flex-shrink: 0; }
        
        .active-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
        .active-bars div { width: 3px; background: #d946ef; border-radius: 2px 2px 0 0; animation: bounce 1s infinite; }
        .active-bars div:nth-child(2) { animation-duration: 0.8s; }
        .active-bars div:nth-child(3) { animation-duration: 1.2s; }
        @keyframes bounce { 0%, 100% { height: 40%; } 50% { height: 100%; } }

        .empty-state { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #6b7280; }
    </style>
</head>
<body>

    <!-- Starry background layer -->
    <div class="stars"></div>

    <!-- Hidden Audio Element (No YouTube API needed) -->
    <audio id="audio-player"></audio>

    <!-- Top Status Bar -->
    <div class="top-bar flex justify-between items-center text-sm text-gray">
        <div class="flex items-center gap-2">
            <!-- Discord SVG Icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#a855f7"><path d="M20.3 5.2C18.8 4.5 17.2 4 15.5 3.7l-.4.8c-1.8-.3-3.6-.3-5.3 0l-.4-.8c-1.7.3-3.3.8-4.8 1.5-3 4.5-3.8 8.9-3.4 13.2 1.9 1.4 3.9 2.3 5.9 2.8l1.3-1.6c-1.1-.3-2.2-.8-3.1-1.4 1.4 1 3 1.7 4.7 2.1 1.6.4 3.3.4 4.9 0 1.7-.4 3.3-1.1 4.7-2.1-1 .6-2.1 1.1-3.1 1.4l1.3 1.6c2-.5 4-1.4 5.9-2.8.5-4.7-.6-9.1-3.6-13.2zM8.5 15.3c-1.2 0-2.1-1-2.1-2.3 0-1.2.9-2.3 2.1-2.3s2.1 1 2.1 2.3c0 1.2-1 2.3-2.1 2.3zm7 0c-1.2 0-2.1-1-2.1-2.3 0-1.2.9-2.3 2.1-2.3s2.1 1 2.1 2.3c0 1.2-.9 2.3-2.1 2.3z"/></svg>
            <span class="font-semibold text-white">Animus Tavern Music Player</span>
            <span style="opacity: 0.5; margin: 0 4px;">|</span>
            <span id="discord-status" style="color: #fbbf24;" class="text-xs pulse">Connecting to Discord SDK...</span>
        </div>
        <div id="clock" class="font-mono">00:00</div>
    </div>

    <!-- MODAL 1: THE PLAYER -->
    <div id="modal-player" class="glass-modal" style="top: 80px; left: 40px; z-index: 10;">
        <div class="drag-handle flex justify-between items-center">
            <div class="flex items-center gap-2 text-gray">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" opacity="0.5"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
                <span class="font-semibold text-sm tracking-wide">PLAYER</span>
            </div>
            <div class="flex gap-1">
                <div class="window-dot" style="background: #4b5563"></div>
                <div class="window-dot" style="background: #4b5563"></div>
                <div class="window-dot pulse" style="background: #d946ef"></div>
            </div>
        </div>

        <div class="player-content flex flex-col items-center">
            <div class="glow-bg"></div>
            
            <div id="album-art" class="album-art">
                <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            </div>

            <div class="w-full text-center" style="position: relative; z-index: 10;">
                <h2 id="track-title" class="text-2xl font-bold truncate" style="margin-bottom: 4px;">No Track Loaded</h2>
                <p id="track-artist" class="text-fuchsia text-sm truncate font-semibold" style="margin-bottom: 24px;">Awaiting Input...</p>

                <!-- Progress Bar -->
                <div class="flex items-center gap-3 text-xs text-gray font-mono" style="margin-bottom: 24px;">
                    <span id="time-current">0:00</span>
                    <div class="progress-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>

                <!-- Controls -->
                <div class="flex items-center justify-center gap-6">
                    <button id="btn-shuffle" class="text-gray icon-btn" title="Shuffle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                    </button>
                    <button id="btn-prev" class="text-gray icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line></svg>
                    </button>
                    <button id="btn-play" class="btn-play">
                        <span id="play-icon-wrapper" style="margin-left: 2px;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </span>
                    </button>
                    <button id="btn-next" class="text-gray icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line></svg>
                    </button>
                    <button id="btn-repeat" class="text-gray icon-btn" title="Repeat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                    </button>
                </div>
                
                <!-- Volume -->
                <div class="flex items-center justify-center gap-3 text-gray" style="margin-top: 24px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 16.5c1.3-1.8 1.3-4.2 0-6M19 19.5c3.2-4.5 3.2-10.5 0-15"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: QUEUE & UPLOAD -->
    <div id="modal-queue" class="glass-modal" style="top: 80px; right: 40px; height: 440px; z-index: 10;">
        <div class="drag-handle flex justify-between items-center">
            <div class="flex items-center gap-2 text-gray">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" opacity="0.5"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
                <span class="font-semibold text-sm tracking-wide">QUEUE & UPLOAD</span>
            </div>
            <span id="track-count" class="text-xs font-mono text-gray" style="background: #374151; padding: 2px 6px; border-radius: 4px;">0 TRKS</span>
        </div>

        <div class="queue-content">
            <!-- Upload Zone -->
            <div id="upload-zone" class="upload-zone">
                <input type="file" id="file-input" accept="audio/mpeg, audio/mp3, audio/wav" multiple class="file-input">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 8px auto;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <p class="text-sm font-semibold text-gray" style="margin-bottom: 4px;">Drop MP3s or Folders here</p>
                <p class="text-xs text-gray" style="opacity: 0.7;">Supports multiple files & folders</p>
            </div>

            <!-- Playlist -->
            <div class="playlist-container" id="playlist">
                <div class="empty-state">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 8px; opacity: 0.5;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <p class="text-sm">Queue is empty</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Type module allows us to use modern imports like the Discord SDK -->
    <script type="module">
        import { DiscordSDK } from 'https://esm.sh/@discord/embedded-app-sdk';

        const DISCORD_CLIENT_ID = '1478929818694189076';
        let discordSdk;

        async function initDiscord() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.get('frame_id')) {
                    throw new Error("Missing frame_id. Running in browser instead of Discord.");
                }

                discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
                await discordSdk.ready();
                
                const statusSpan = document.getElementById('discord-status');
                statusSpan.textContent = "Activity Ready";
                statusSpan.style.color = "#4ade80"; // green
                statusSpan.classList.remove('pulse');
            } catch (error) {
                console.warn("Discord SDK Initialization Skipped:", error.message);
                const statusSpan = document.getElementById('discord-status');
                statusSpan.textContent = "Running Outside Discord";
                statusSpan.style.color = "#9ca3af"; // gray
                statusSpan.classList.remove('pulse');
            }
        }

        initDiscord();

        // --- State ---
        let tracks = [];
        let currentTrackIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeatOne = false;
        let shuffleHistory = [];
        let zIndexCounter = 10;

        // --- DOM Elements ---
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('btn-play');
        const playIconWrapper = document.getElementById('play-icon-wrapper');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const volumeSlider = document.getElementById('volume-slider');
        
        const shuffleBtn = document.getElementById('btn-shuffle');
        const repeatBtn = document.getElementById('btn-repeat');
        
        const trackTitleUI = document.getElementById('track-title');
        const trackArtistUI = document.getElementById('track-artist');
        const albumArt = document.getElementById('album-art');
        
        const fileInput = document.getElementById('file-input');
        const playlistUI = document.getElementById('playlist');
        const trackCountUI = document.getElementById('track-count');
        const uploadZone = document.getElementById('upload-zone');

        // SVG Constants
        const iconPlay = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
        const iconPause = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
        const iconMusic = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;

        // --- Clock Update ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        audio.volume = volumeSlider.value;

        // --- Dragging Logic ---
        function makeDraggable(modalId) {
            const modal = document.getElementById(modalId);
            const handle = modal.querySelector('.drag-handle');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            modal.addEventListener('mousedown', () => bringToFront(modal));
            modal.addEventListener('touchstart', () => bringToFront(modal), {passive: true});

            handle.addEventListener('mousedown', dragStart);
            handle.addEventListener('touchstart', dragStart, {passive: false});

            function bringToFront(element) {
                zIndexCounter++;
                element.style.zIndex = zIndexCounter;
            }

            function dragStart(e) {
                bringToFront(modal);
                if (e.type === 'touchstart') {
                    pos3 = e.touches[0].clientX;
                    pos4 = e.touches[0].clientY;
                    document.addEventListener('touchmove', dragAction, {passive: false});
                    document.addEventListener('touchend', dragEnd);
                } else {
                    e.preventDefault();
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    document.onmouseup = dragEnd;
                    document.onmousemove = dragAction;
                }
            }

            function dragAction(e) {
                if (e.type === 'touchmove') e.preventDefault();
                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                
                let newTop = modal.offsetTop - pos2;
                let newLeft = modal.offsetLeft - pos1;

                if(newTop < 40) newTop = 40;
                if(newTop > window.innerHeight - 50) newTop = window.innerHeight - 50;
                
                modal.style.top = newTop + "px";
                modal.style.left = newLeft + "px";
            }

            function dragEnd() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.removeEventListener('touchmove', dragAction);
                document.removeEventListener('touchend', dragEnd);
            }
        }

        makeDraggable('modal-player');
        makeDraggable('modal-queue');

        window.addEventListener('load', () => {
            const player = document.getElementById('modal-player');
            const queue = document.getElementById('modal-queue');

            if (window.innerWidth < 800) {
                player.style.left = '50%';
                player.style.transform = 'translateX(-50%)';
                player.style.top = '60px';
                
                queue.style.left = '50%';
                queue.style.transform = 'translateX(-50%)';
                queue.style.top = '120px';
            } else {
                const totalWidth = player.offsetWidth + 20 + queue.offsetWidth;
                const startLeft = (window.innerWidth - totalWidth) / 2;
                const topPos = (window.innerHeight - queue.offsetHeight) / 2;
                
                player.style.left = startLeft + 'px';
                player.style.top = Math.max(60, topPos) + 'px';
                
                queue.style.left = (startLeft + player.offsetWidth + 20) + 'px';
                queue.style.top = Math.max(60, topPos) + 'px';
            }
        });

        // --- Audio & File Logic ---
        function processFile(file) {
            if (file.type.startsWith("audio/") || file.name.toLowerCase().match(/\.(mp3|wav|ogg)$/)) {
                const objectUrl = URL.createObjectURL(file);
                
                let title = file.name.replace(/\.[^/.]+$/, ""); // strip extension
                let artist = "Local File";
                
                // Smart parsing: Try to detect "(Backing vocals)" or standard "Artist - Title" format
                if (title.includes('-')) {
                    const parts = title.split('-');
                    artist = parts[0].trim();
                    title = parts.slice(1).join('-').trim();
                }

                tracks.push({
                    title: title,
                    artist: artist,
                    url: objectUrl,
                    filename: file.name
                });

                renderPlaylist();
                if (currentTrackIndex === -1 && tracks.length === 1) {
                    loadTrack(0);
                }
            }
        }

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            Array.from(files).forEach(processFile);
            fileInput.value = ''; 
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.remove('dragover'), false);
        });

        uploadZone.addEventListener('drop', (e) => {
            const items = e.dataTransfer.items;
            if (items) {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.kind === 'file') {
                        const entry = item.webkitGetAsEntry();
                        if (entry) traverseFileTree(entry);
                    }
                }
            } else {
                const files = e.dataTransfer.files;
                Array.from(files).forEach(processFile);
            }
        });

        function traverseFileTree(item, path) {
            path = path || "";
            if (item.isFile) {
                item.file(function(file) { processFile(file); });
            } else if (item.isDirectory) {
                let dirReader = item.createReader();
                dirReader.readEntries(function(entries) {
                    for (let i = 0; i < entries.length; i++) {
                        traverseFileTree(entries[i], path + item.name + "/");
                    }
                });
            }
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', () => playPrev());
        nextBtn.addEventListener('click', () => playNext(false));
        shuffleBtn.addEventListener('click', toggleShuffle);
        repeatBtn.addEventListener('click', toggleRepeat);
        
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            timeTotal.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('ended', () => playNext(true));

        progressContainer.addEventListener('click', (e) => {
            if (tracks.length === 0 || isNaN(audio.duration)) return;
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function renderPlaylist() {
            trackCountUI.textContent = `${tracks.length} TRKS`;
            
            if (tracks.length === 0) {
                playlistUI.innerHTML = `
                    <div class="empty-state">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 8px; opacity: 0.5;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        <p class="text-sm">Queue is empty</p>
                    </div>`;
                return;
            }

            playlistUI.innerHTML = '';
            tracks.forEach((track, index) => {
                const isActive = index === currentTrackIndex;
                const trackEl = document.createElement('div');
                trackEl.className = `track-item ${isActive ? 'active' : ''}`;
                trackEl.onclick = () => loadTrack(index, true);

                trackEl.innerHTML = `
                    <div class="track-icon">
                        ${isActive && isPlaying ? 
                            `<div class="active-bars"><div></div><div></div><div></div></div>` 
                            : `<div style="color: #9ca3af;">${iconMusic}</div>`
                        }
                    </div>
                    <div class="flex-grow truncate">
                        <h4 class="font-semibold text-xs truncate ${isActive ? 'text-fuchsia' : 'text-white'}">${track.title}</h4>
                        <p class="text-xs text-gray truncate" style="margin-top: 2px;">${track.artist}</p>
                    </div>
                `;
                playlistUI.appendChild(trackEl);
            });
        }

        function loadTrack(index, autoPlay = false) {
            if (index < 0 || index >= tracks.length) return;
            
            currentTrackIndex = index;
            const track = tracks[index];
            
            trackTitleUI.textContent = track.title;
            trackArtistUI.textContent = track.artist;
            
            audio.src = track.url;
            
            albumArt.classList.add('pop');
            setTimeout(() => albumArt.classList.remove('pop'), 200);

            renderPlaylist();
            
            if (autoPlay || isPlaying) {
                audio.play();
                isPlaying = true;
                updatePlayIcon();
                renderPlaylist(); // Update animation bars
            }
        }

        function togglePlay() {
            if (tracks.length === 0) return;
            
            if (audio.paused) {
                audio.play();
                isPlaying = true;
            } else {
                audio.pause();
                isPlaying = false;
            }
            
            updatePlayIcon();
            renderPlaylist(); 
        }

        function updatePlayIcon() {
            if (isPlaying) {
                playIconWrapper.innerHTML = iconPause;
                playIconWrapper.style.marginLeft = "0px";
            } else {
                playIconWrapper.innerHTML = iconPlay;
                playIconWrapper.style.marginLeft = "2px";
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            if (isShuffle && currentTrackIndex !== -1) {
                shuffleHistory = [currentTrackIndex]; 
            }
        }

        function toggleRepeat() {
            isRepeatOne = !isRepeatOne;
            repeatBtn.classList.toggle('active', isRepeatOne);
        }

        function playNext(autoEnded = false) {
            if (tracks.length === 0) return;
            
            if (autoEnded && isRepeatOne) {
                loadTrack(currentTrackIndex, true);
                return;
            }

            let nextIndex;
            
            if (isShuffle && tracks.length > 1) {
                let available = tracks.map((_, i) => i).filter(i => !shuffleHistory.includes(i));
                
                if (available.length === 0) {
                    shuffleHistory = [currentTrackIndex];
                    available = tracks.map((_, i) => i).filter(i => i !== currentTrackIndex);
                }
                
                nextIndex = available[Math.floor(Math.random() * available.length)];
                shuffleHistory.push(nextIndex);
            } else {
                nextIndex = currentTrackIndex + 1;
                if (nextIndex >= tracks.length) nextIndex = 0; 
            }
            
            loadTrack(nextIndex, true);
        }

        function playPrev() {
            if (tracks.length === 0) return;
            
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            
            let prevIndex;
            if (isShuffle && shuffleHistory.length > 1) {
                shuffleHistory.pop(); 
                prevIndex = shuffleHistory[shuffleHistory.length - 1]; 
            } else {
                prevIndex = currentTrackIndex - 1;
                if (prevIndex < 0) prevIndex = tracks.length - 1;
            }
            
            loadTrack(prevIndex, true);
        }

        function updateProgress() {
            if (isNaN(audio.duration)) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            timeCurrent.textContent = formatTime(audio.currentTime);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
